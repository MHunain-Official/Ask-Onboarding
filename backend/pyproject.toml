[project]
name = "ask-onboarding-backend"
version = "0.1.0"
description = "Ask Onboarding: RAG backend that answers questions only from uploaded documents."
readme = "README.md"
authors = [
    { name = "MHunain-Official", email = "m.hunainofficial@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "openai>=1.46.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pypdf>=7.0.0",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "sse-starlette>=3.6.0",
    "structlog>=26.1.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The package is `app`, not `src/<name>` — the owner reads one flat package.
packages = ["app"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's Depends()/Cookie() in argument defaults is the documented,
# idiomatic pattern (see FastAPI docs) — not the footgun B008 usually flags.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true
