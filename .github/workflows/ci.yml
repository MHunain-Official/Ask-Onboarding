name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: askonboarding
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d askonboarding"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/askonboarding
      SECRET_KEY: ci-secret-not-for-production-use-only
      LLM_API_KEY: test
      EMBEDDING_API_KEY: test
      SEED_ON_START: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install
        run: uv sync
      - name: Lint
        run: uv run ruff check app tests && uv run ruff format --check app tests
      - name: Types
        run: uv run mypy app
      - name: Migrate
        run: uv run alembic upgrade head
      - name: Test
        run: uv run pytest -q --cov=app --cov-report=xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --run
        continue-on-error: true
